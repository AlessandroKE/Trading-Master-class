# Docker Compose for the trader-helper bot.
#
# v1 DB = SQLite (chosen in bot-architecture.md): the file lives in the ./data volume so it
# survives container restarts — no separate DB service needed. The `postgres` service below
# is COMMENTED OUT and reserved for when a UI / concurrent access arrives (see notes).

services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data        # SQLite file persists here
    # P1 runs once and exits. For scheduled runs on a host, use cron to
    # `docker compose run --rm bot`. P4 will make this a long-running service with restart.
    restart: "no"

